<!-- @dsCard group="Motifs" viewport="700x170" name="Motion" subtitle="Snap is stepped (mechanical), draw is eased; glitch reserved" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;display:flex;flex-direction:column;gap:16px;justify-content:center;height:168px}
.tr{height:14px;background:var(--c-raise);position:relative}.dot{position:absolute;top:3px;left:4px;width:8px;height:8px;background:var(--c-accent)}
.a1{animation:go 1.6s var(--e-snap) infinite alternate}.a2{animation:go 1.6s var(--e-draw) infinite alternate}
@keyframes go{to{left:calc(100% - 12px)}}
.r{display:flex;gap:16px;align-items:center}.t{font-family:var(--f-display);font-size:9.5px;color:var(--c-ink-3);width:210px;flex:none}</style></head><body>
<div class="r"><span class="t">--e-snap · steps(3) · 160ms UI state</span><div class="tr" style="flex:1"><div class="dot a1"></div></div></div>
<div class="r"><span class="t">--e-draw · cubic-bezier(.16,1,.3,1) · 340ms</span><div class="tr" style="flex:1"><div class="dot a2"></div></div></div>
<span class="micro">--m-glitch 200ms — reserved for rgb-shift moments · full reduced-motion kill</span>
</body></html>
