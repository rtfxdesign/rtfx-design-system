# rtfx.space — static site; publish this folder as-is (no build step)
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS and JS revalidate on every load (ETag makes the check cheap). A week of
# max-age meant returning visitors ran week-old scripts while the site was
# being iterated daily - stale behavior that no deploy could reach.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/work/*/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"


# allen.rtfx.space → serves /allen/ at the subdomain root (requires the
# subdomain to be added as a domain alias on this Netlify site and a Cloudflare
# CNAME allen → <site>.netlify.app, DNS-only / grey cloud).
[[redirects]]
  from = "https://allen.rtfx.space/*"
  to = "/allen/:splat"
  status = 200
  force = true

# Short résumé URL used on the link page and business cards.
[[redirects]]
  from = "/resume/*"
  to = "/assets/allen-grabo-resume.pdf"
  status = 302
