<script type="text/babel">
const { Home, CaseStudy, Contact } = window.RTFXDesignSystem_ceb80c;
function App() {
  const [screen, setScreen] = React.useState(() => location.hash.replace('#', '') || 'home');
  const nav = (s) => { setScreen(s); try { history.replaceState(null, '', '#' + s); } catch (e) {} window.scrollTo(0, 0); };
  if (screen === 'case') return <CaseStudy nav={nav} />;
  if (screen === 'contact') return <Contact nav={nav} />;
  return <Home nav={nav} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
